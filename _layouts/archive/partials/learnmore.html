<!-- Call to Action -->
<section class="mt-5 mb-5" style="">
  <div class="col-12 col-md-6 offset-md-3">
    <h2 class="mb-4">Not ready just yet? Sign up for our list!</h2>
    <form class="form-group form-inline" id="electrade-form-learn">
      <input type="email" required name="email" placeholder="you@email.com" class="form-control col-5"
        style="border-radius: 0; border-top-left-radius: 3px; border-bottom-left-radius: 3px;" />
      <input class="btn btn-block btn-primary form-control col-5"
        style="border-radius: 0; border-top-right-radius: 3px; border-bottom-right-radius: 3px;" type="submit"
        value="✉️ Get Updates" id="submit-form" />
    </form>
  </div>
</section>

<div id="WIP-learn" style="display: none">
  <p class="text-dark text-center">Submitting...</p>
</div>

<div id="thanks-learn" style="display: none">
  <h3 class="text-dark text-center">Thank you!</h3>
</div>

<script>
  // SUBMIT EMAIL TO GSHEET
  var $formElementLearn = document.getElementById('electrade-form-learn')
  var $WIPLearn = document.getElementById('WIP-learn')
  var $thanksLearn = document.getElementById('thanks-learn')
  var url = 'https://script.google.com/macros/s/AKfycbwRbZS37yjD4W-qV8f8nFxlVFcuS-D3eBjEQomLZHA6TkXkoMg/exec'
  $formElementLearn.addEventListener('submit', function (event) {
    event.preventDefault();
    $formElementLearn.style.display = 'none'
    $WIPLearn.style.display = 'block'
    fetch(url + '?email=' + $formElementLearn.elements[0].value.replace('@', '%40')).then((response) => {
      if (response.ok) {
        $WIPLearn.style.display = 'none'
        $thanksLearn.style.display = 'block'
        return response.json();
      }
      return Promise.reject(response);
    }).then((data) => {
      console.log(data);
    }).catch((error) => {
      console.warn(error);
    });
  });
</script>
