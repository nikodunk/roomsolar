backend:
  name: git-gateway
  branch: master # Branch to update (optional; defaults to master)
  identity_url: 'https://xenodochial-clarke-648ebb.netlify.app/.netlify/identity'
  gateway_url: 'https://xenodochial-clarke-648ebb.netlify.app/.netlify/git'
media_folder: static/img_cms
public_folder: /img
collections:
  - name: 'blog'
    label: 'Blog'
    folder: 'content/blog'
    create: true
    slug: '{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Layout', name: 'layout', widget: 'string', default: 'post' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Image', name: 'image', widget: 'string' }
      - { label: 'Type', name: 'type', widget: 'string', default: 'post' }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: true }
      - { label: 'Body', name: 'body', widget: 'markdown' }