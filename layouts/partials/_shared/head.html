<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<link rel="icon" href="./sarah_spinning_sun.png">
	<title>{{ .Page.Title }} | {{ .Site.Title }}</title>
	{{ with .Site.Params.meta.description }}<meta name="description" content="{{ . }}">{{ end }}
	{{ with .Site.Params.meta.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
	<link href="https://fonts.googleapis.com/css?family=Righteous%7CMerriweather:300,300i,400,400i,700,700i" rel="stylesheet">
	<link href="{{ "/css/medium.css" | urlize | relURL }}" rel="stylesheet">
	<link href="{{ "/css/additional.css" | urlize | relURL }}" rel="stylesheet">
	<!-- link to the SqPaymentForm library -->
	<script type="text/javascript" src="https://js.squareupsandbox.com/v2/paymentform">
	</script>
	<!-- link to the local custom styles for SqPaymentForm -->
	<link rel="stylesheet" type="text/css" href="mysqpaymentform.css">

	<!--  Essential META Tags -->
	{{ if .Params.title -}}
    <meta property="og:title" content="Sunboxlabs - The best DIY solar + storage kits for apartment, balcony, condos or back garden.">
  {{ else }}
    <meta property="og:title" content="{{ .Params.title }} | Sunboxlabs - The best DIY solar + storage kits for apartment, balcony, condos or back garden.">
  {{- end }}

  <meta property="og:description" content="Find the best off-grid solar + battery kits for all your RV and camping needs. | {{ .Summary | plainify | safeHTML }}">

  {{ if .Params.image -}}
    <meta property="og:image" content="{{ .Params.image | absURL }}">
  {{ else }}
    <meta property="og:image" content="https://sunboxlabs.com/solar-kit/img/banner.jpg">
  {{- end }}

  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">

  <!--  Non-Essential, But Recommended -->
  <meta property="og:site_name" content="{{ .Params.title }} | sunboxlabs">
  <meta name="twitter:image:alt" content="Find the best off-grid solar + battery kits for all your RV and camping needs.">

</head>
