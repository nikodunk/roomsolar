<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<link rel="icon" href="https://sunboxlabs.com/sarah_spinning_sun.png">

	<title>{{ .Params.title }} | Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors.</title>

	<meta name="description" content="Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors.">
	{{ with .Site.Params.meta.keywords }}
	<meta name="keywords" content="{{ . }}">{{ end }}

	<!--  Essential META Tags -->
	{{ if .Params.title -}}
	<meta property="og:title"
		content="{{ .Params.title }} | Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors.">
	{{ else }}
	<meta property="og:title"
		content="Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors.">
	{{- end }}

	<meta property="og:description"
		content="Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors. | {{ .Summary | plainify | safeHTML }}">

	{{ if .Params.image -}}
	<meta property="og:image" content="{{ .Params.image | absURL }}">
	{{ else }}
	<meta property="og:image" content="https://sunboxlabs.com/img_5/header_0.jpg">
	{{- end }}

	<meta property="og:url" content="{{ .Permalink }}">
	<meta name="twitter:card" content="summary_large_image">

	<!--  Non-Essential, But Recommended -->
	<meta property="og:site_name" content="{{ .Params.title }} | sunboxlabs">
	<meta name="twitter:image:alt"
		content="Sunboxlabs - Premium Solar Kits for self-install clean energy, and batteries for backup, off-grid & outdoors.">

	<meta name="facebook-domain-verification" content="d9nb2r05ht1utbp7q2blq9qwx8f8be" />

	{{ partial "_shared/site-schema" . }}

	<link href="/css/fonts.css" rel="stylesheet">
	<link media="screen" href="/css/bootstrap5.min.css" rel="stylesheet" type="text/css">
	<link media="screen" href="/css/styles.css" rel="stylesheet" type="text/css">

</head>
