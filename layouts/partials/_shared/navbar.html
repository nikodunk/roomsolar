    <script>
        var navForm = $('form#electrade-nav')
        var url = 'https://script.google.com/macros/s/AKfycbwRbZS37yjD4W-qV8f8nFxlVFcuS-D3eBjEQomLZHA6TkXkoMg/exec'
        $.fn.serializeObject = function()
        {
          var o = {};
          var a = this.serializeArray();
          $.each(a, function() {
              if (o[this.name]) {
                  if (!o[this.name].push) {
                      o[this.name] = [o[this.name]];
                  }
                  o[this.name].push(this.value || '');
              } else {
                  o[this.name] = this.value || '';
              }
          });
          return o;
        };


        // Example starter JavaScript for disabling form submissions if there are invalid fields
        (function() {
          'use strict';
          window.addEventListener('load', function() {
            // Loop over them and prevent submission
            var validation = Array.prototype.filter.call(navForm, function(form) {
              form.addEventListener('submit', function(event) {
                console.log('working')
                $("#electrade-nav").hide();
                $("#WIP-nav").show();
                if (form.checkValidity() === false) {
                  event.preventDefault();
                  event.stopPropagation();
                }
                else{
                    event.preventDefault();
                    var jqxhr = $.ajax({
                      url: url,
                      method: "GET",
                      dataType: "json",
                      data: navForm.serializeObject(),
                      success: function(result){ $("#WIP-nav").hide(); $("#thanks-nav").show() }
                    })
                }
                form.classList.add('was-validated');
              }, false);
            });
          }, false);
        })();
      </script>
